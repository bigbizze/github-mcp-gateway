name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn type-check
      - run: yarn lint
      - run: yarn test
        env:
          # Optional repository secret. See test/account-neutrality.test.ts.
          FORBIDDEN_IDENTITIES: ${{ secrets.FORBIDDEN_IDENTITIES }}
      - run: yarn build
